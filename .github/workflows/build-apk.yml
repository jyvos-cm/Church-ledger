name: Build APK Church Ledger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Init Bubblewrap project
        run: |
          mkdir apk-build && cd apk-build
          bubblewrap init \
            --manifest "https://jyvos-cm.github.io/Church-ledger/manifest.json" \
            --directory .
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Patch targetSdkVersion to 34
        run: |
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/' apk-build/app/build.gradle
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/' apk-build/app/build.gradle
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 24/' apk-build/app/build.gradle
          echo "=== build.gradle après patch ==="
          grep -E "targetSdk|compileSdk|minSdk" apk-build/app/build.gradle

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore apk-build/church-ledger.keystore \
            -alias church-ledger \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -dname "CN=Church Ledger, OU=JYVOS, O=JYVOS-CM, L=Yaounde, S=Centre, C=CM" \
            -storepass churchledger2024 \
            -keypass churchledger2024

      - name: Build APK
        run: |
          cd apk-build
          bubblewrap build \
            --keystore church-ledger.keystore \
            --keystorePassword churchledger2024 \
            --keyAlias church-ledger \
            --keyPassword churchledger2024
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: church-ledger-apk
          path: apk-build/app-release-signed.apk
          retention-days: 30
